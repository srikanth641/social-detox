services:
  - type: web
    name: social-detox
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build
    startCommand: npm start --prefix server
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: social-detox-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_MODEL
        value: gemini-1.5-flash
      - key: MOTIVATION_API_URL
        value: https://zenquotes.io/api/today
      - key: LOG_LEVEL
        value: info

databases:
  - name: social-detox-db
    databaseName: social_detox
    user: detox_user
    plan: free
    region: oregon
